services:
  app:
    build: .
    ports:
      - "3847:3847"
    environment:
      APP_MODE: ${APP_MODE:-fixture}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.7}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      DB_PATH: /app/data/insights.sqlite
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
    volumes:
      - insights-data:/app/data

volumes:
  insights-data:
